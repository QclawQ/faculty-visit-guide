    button:disabled { opacity: .55; cursor: wait; }
    :focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
    #status { color: #666; font-size: 14px; min-height: 20px; line-height: 1.5; }

    </form>
    <p id="status" role="status" aria-live="polite">正在打开…</p>

    const submit = document.getElementById('submit');
    const status = document.getElementById('status');
    let canRemember = true;
    try {
      localStorage.setItem('faculty-guide-storage-test', '1');
      localStorage.removeItem('faculty-guide-storage-test');
    } catch (_) {
      canRemember = false;
      staticryptConfig.isRememberEnabled = false;
      rememberInput.checked = false;
      rememberInput.disabled = true;
    }
    const engine = staticryptInitiator.init(staticryptConfig, templateConfig);
    function showForm(message = '') {
      form.hidden = false;
      status.textContent = message;
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      status.textContent = '正在打开…';
      try {
        const result = await engine.handleDecryptionOfPage(passwordInput.value, canRemember && rememberInput.checked);
        if (!result.isSuccessful) {
          showForm('密码不对，请重试。');
          passwordInput.focus();
        }
      } catch (_) {
        showForm('暂时无法打开，请刷新后重试。');
      } finally {
        submit.disabled = false;
      }
    });
    window.addEventListener('load', async () => {
      if (!window.crypto || !window.crypto.subtle) {
        status.textContent = '请使用 HTTPS 链接和较新的浏览器打开。';
        return;
      }
      try {
        if (canRemember && (await engine.handleDecryptOnLoad()).isSuccessful) return;
      } catch (_) { /* Fall back to manual entry if browser storage is unavailable. */ }
      showForm(canRemember ? '' : '此浏览器无法记住密码，可手动输入。');
    });
  </script>
</body>
</html>
