    button:disabled { opacity: .55; cursor: wait; }
    :focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
    #status { color: #666; font-size: 14px; min-height: 20px; line-height: 1.5; }
    [hidden] { display: none !important; }
  </style>
</head>

      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <label class="remember"><input id="remember" type="checkbox" checked>记住此设备</label>
      <button id="submit" type="submit">进入</button>
    </form>
    <p id="status" role="status" aria-live="polite">正在打开…</p>
